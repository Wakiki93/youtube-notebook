[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-clip-poster"
version = "0.1.0"
description = "Clip long YouTube videos into Instagram Reels with AutoClip and post them daily through Postiz."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
# The clipping engine. Pinned so a surprise upgrade can't change the output format we parse.
clip = ["autoclip-mcp==1.5.7.post1"]
# Local transcription for videos without captions (large download).
whisper = ["faster-whisper>=1.0"]
# The GTA scout's downloader. Left unpinned on purpose: YouTube and Twitch change often
# and only the newest yt-dlp keeps up.
scout = ["yt-dlp>=2026.10.26"]
dev = ["pytest>=8"]

[project.scripts]
acp = "auto_clip_poster.cli:main"

[tool.setuptools]
packages = ["auto_clip_poster", "auto_clip_poster.scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
